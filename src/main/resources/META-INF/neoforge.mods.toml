modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CinemaMod/webdisplays/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/CinemaMod/webdisplays"
logoFile=""
credits=""
authors="${mod_authors}"
description='''${mod_description}'''

# MouseHandlerMixin and OverlayMixin are left out of webdisplays.mixins.json: this file was never
# declared before, so they never ran, and OverlayMixin targets pre-1.21 Gui fields (would crash).
[[mixins]]
config="webdisplays.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mcef"
type="required"
versionRange="[2.1.0,)"
ordering="NONE"
side="BOTH"
